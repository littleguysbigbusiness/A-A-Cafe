<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☕ A&A Cafe</title>
    <style>
        :root {
            --bg-main: #f1f5f9; /* Soft light gray-blue */
            --surface: #ffffff; /* Pure White */
            --border: #cbd5e1;  /* Light slate border */
            --text-main: #0f172a; /* Dark slate text */
            --text-muted: #64748b; /* Muted gray text */
            --accent: #2563eb; /* Vibrant Royal Blue */
            --accent-hover: #1d4ed8;
            --success: #10b981;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
        }

        header {
            background-color: var(--accent);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2);
        }
        header h1 { margin: 0; font-size: 22px; color: var(--surface); font-weight: 700; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .grid-2 { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 30px; }

        .panel {
            background: var(--surface);
            padding: 30px;
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        h2, h3 { margin-top: 0; padding-bottom: 12px; border-bottom: 2px solid var(--bg-main); color: var(--text-main); }

        /* SECURITY GATE */
        .auth-card { max-width: 400px; margin: 100px auto; text-align: center; }
        .auth-toggle { margin-top: 15px; font-size: 13px; color: var(--text-muted); cursor: pointer; text-decoration: underline; }
        .auth-toggle:hover { color: var(--accent); }

        input {
            width: 100%; padding: 12px; margin: 8px 0 18px 0; box-sizing: border-box;
            border: 1px solid var(--border); border-radius: 8px; background: var(--bg-main);
            color: var(--text-main); font-size: 14px; transition: border 0.2s;
        }
        input:focus { border-color: var(--accent); outline: none; background: var(--surface); }

        .btn-action {
            background: var(--accent); color: var(--surface); padding: 14px;
            border: none; border-radius: 8px; cursor: pointer; width: 100%;
            font-size: 15px; font-weight: 600; transition: background 0.2s;
        }
        .btn-action:hover { background: var(--accent-hover); }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin: 20px 0; }
        .menu-item {
            padding: 15px 10px; border: 1px solid var(--border); border-radius: 8px;
            cursor: pointer; text-align: center; background: var(--bg-main);
            font-weight: 600; font-size: 13px; color: var(--text-main); transition: 0.2s;
        }
        .menu-item:hover { border-color: var(--accent); background: var(--surface); transform: translateY(-1px); }
        .menu-item.selected { background-color: var(--accent); color: var(--surface); border-color: var(--accent); }

        .total-box {
            background: #eff6ff; color: var(--accent); padding: 15px;
            border-radius: 8px; text-align: right; font-size: 22px; font-weight: 700;
            margin: 15px 0; border: 1px solid #bfdbfe;
        }

        .order-card {
            background: var(--surface); border: 1px solid var(--border);
            border-left: 4px solid var(--accent); padding: 15px; margin-bottom: 15px; border-radius: 8px;
        }
        .logout-btn { background: #fee2e2; color: #ef4444; border: 1px solid #fca5a5; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .logout-btn:hover { background: #fca5a5; }
    </style>
</head>
<body>

    <div id="authContainer">
        <div class="panel auth-card">
            <h2 id="authTitle">Customer Login</h2>
            <div style="text-align: left; margin-top: 20px;">
                <label><strong>Account Name:</strong></label>
                <input type="text" id="authName" placeholder="Enter your name">
                
                <label><strong>Password:</strong></label>
                <input type="password" id="authPass" placeholder="••••••••">
                
                <button class="btn-action" id="authSubmitBtn" onclick="handleAuth()">Log In</button>
            </div>
            <div class="auth-toggle" id="authSwitch" onclick="toggleAuthMode()">New customer? Create an account here</div>
        </div>
    </div>

    <div id="appContainer" style="display: none;">
        <header>
            <h1>☕ A&A Cafe</h1>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span id="userGreeting" style="font-size: 14px; font-weight: 600; color: white;"></span>
                <button class="logout-btn" onclick="logOutSession()">Sign Out</button>
            </div>
        </header>

        <div class="container">
            <div class="grid-2">
                <div class="panel">
                    <h3>Place an Order</h3>
                    <div class="menu-grid">
                        <div class="menu-item" onclick="toggleItem(this, 'Muffin', 2)">Muffin ($2)</div>
                        <div class="menu-item" onclick="toggleItem(this, 'Cupcake', 2)">Cupcake ($2)</div>
                        <div class="menu-item" onclick="toggleItem(this, 'Whole Pie', 10)">Whole Pie ($10)</div>
                        <div class="menu-item" onclick="toggleItem(this, 'Coffee', 4)">Coffee ($4)</div>
                        <div class="menu-item" onclick="toggleItem(this, 'Matcha Latte', 9)">Matcha ($9)</div>
                    </div>
                    <div class="total-box">Order Total: $<span id="totalPrice">0</span></div>
                    <button class="btn-action" onclick="submitCustomerOrder()" style="background: var(--success); color: white;">Submit Order</button>
                </div>

                <div>
                    <div class="panel">
                        <h3>Active Progress</h3>
                        <div id="customerTrackerList">No active orders processing.</div>
                    </div>
                    <div class="panel">
                        <h3>📜 My Past Orders</h3>
                        <div id="pastHistoryList">Your historical records populate here.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE_API_URL = "https://api.steinhq.com/v1/storages/6a2c070092b1163e97066729";
        let isRegisterMode = false;
        let loggedInUser = null;
        let selectedItems = [];
        let currentTotal = 0;

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('authTitle').innerText = isRegisterMode ? "Create Customer Account" : "Customer Login";
            document.getElementById('authSubmitBtn').innerText = isRegisterMode ? "Register Account" : "Log In";
            document.getElementById('authSwitch').innerText = isRegisterMode ? "Already have an account? Log in here" : "New customer? Create an account here";
        }

        async function handleAuth() {
            const name = document.getElementById('authName').value.trim();
            const pass = document.getElementById('authPass').value.trim();

            if(!name || !pass) return alert("Please fill out your name and password.");

            loggedInUser = name; 
            localStorage.setItem('activeSessionUser', loggedInUser);
            launchApplication();
        }

        function launchApplication() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
            document.getElementById('userGreeting').innerText = `👤 Customer: ${loggedInUser}`;
            updateCustomerData();
            setInterval(updateCustomerData, 5000);
        }

        function logOutSession() {
            localStorage.removeItem('activeSessionUser');
            loggedInUser = null;
            document.getElementById('authContainer').style.display = 'block';
            document.getElementById('appContainer').style.display = 'none';
        }

        function toggleItem(el, name, price) {
            el.classList.toggle('selected');
            const idx = selectedItems.indexOf(name);
            if(idx > -1) { selectedItems.splice(idx, 1); currentTotal -= price; }
            else { selectedItems.push(name); currentTotal += price; }
            document.getElementById('totalPrice').innerText = currentTotal;
        }

        async function submitCustomerOrder() {
            if(selectedItems.length === 0) return alert("Select menu items before ordering.");

            const payload = {
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                customer: loggedInUser,
                items: selectedItems.join(', '),
                total: currentTotal,
                status: 'Pending',
                paid: 'No',
                eta: '',
                notes: '',
                chef_notes: ''
            };

            await fetch(`${BASE_API_URL}/Sheet1`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify([payload])
            });

            alert("Order sent straight to the kitchen!");
            selectedItems = []; currentTotal = 0;
            document.getElementById('totalPrice').innerText = 0;
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('selected'));
            updateCustomerData();
        }

        async function updateCustomerData() {
            if(!loggedInUser) return;
            try {
                const activeRes = await fetch(`${BASE_API_URL}/Sheet1?search={"customer":"${loggedInUser}"}`);
                const activeOrders = await activeRes.json();
                const container = document.getElementById('customerTrackerList');
                
                if(!activeOrders || activeOrders.length === 0 || activeOrders.error) {
                    container.innerText = "No active orders in the current queue.";
                } else {
                    container.innerHTML = '';
                    activeOrders.reverse().forEach(o => {
                        container.innerHTML += `
                            <div class="order-card">
                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <strong>ID: ${o.id}</strong>
                                    <span style="font-size:12px; color:var(--accent); font-weight:bold;">${o.status}</span>
                                </div>
                                <p style="font-size:13px; margin:8px 0;">Items: ${o.items}</p>
                            </div>`;
                    });
                }
            } catch(e){}
        }

        if(localStorage.getItem('activeSessionUser')) {
            loggedInUser = localStorage.getItem('activeSessionUser');
            launchApplication();
        }
    </script>
</body>
</html>
