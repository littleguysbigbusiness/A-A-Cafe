<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☕ A&A Cafe | Portal</title>
    <style>
        :root {
            --bg-main: #f1f5f9;
            --surface: #ffffff;
            --border: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #10b981;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background: var(--bg-main); color: var(--text-main); }
        header { background: var(--accent); padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2); }
        header h1 { margin: 0; font-size: 22px; color: var(--surface); }
        
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 25px; }
        @media (max-width: 900px) { .grid-3 { grid-template-columns: 1fr; } }

        .panel { background: var(--surface); padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        h2, h3 { margin-top: 0; padding-bottom: 12px; border-bottom: 2px solid var(--bg-main); }

        .auth-card { max-width: 400px; margin: 100px auto; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
        input:focus { border-color: var(--accent); outline: none; }
        
        .btn-action { background: var(--accent); color: white; padding: 14px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-action:hover { background: var(--accent-hover); }

        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 15px 0; }
        .menu-item { padding: 15px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; text-align: center; font-weight: bold; font-size: 13px; }
        .menu-item.selected { background: var(--accent); color: white; border-color: var(--accent); }

        .total-box { background: #eff6ff; color: var(--accent); padding: 15px; border-radius: 8px; text-align: right; font-size: 22px; font-weight: bold; margin-bottom: 15px; }
        .order-card, .notif-card { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        .notif-card { border-left-color: var(--success); background: #f0fdf4; }
        .badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .badge.paid { background: #d1fae5; color: var(--success); }
        .badge.unpaid { background: #fee2e2; color: #ef4444; }
    </style>
</head>
<body>

    <div id="authContainer">
        <div class="panel auth-card">
            <h2>Portal Login</h2>
            <div style="text-align: left;">
                <label><strong>Roblox Username:</strong></label>
                <input type="text" id="authName" placeholder="Player123">
                <button class="btn-action" onclick="handleAuth()">Access Portal</button>
            </div>
        </div>
    </div>

    <div id="appContainer" style="display: none;">
        <header>
            <h1>☕ A&A Cafe</h1>
            <div>
                <span id="userGreeting" style="color: white; font-weight: bold; margin-right: 15px;"></span>
                <button onclick="location.reload()" style="background: #fee2e2; color: #ef4444; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">Logout</button>
            </div>
        </header>

        <div class="container grid-3">
            <div class="panel">
                <h3>Kiosk Order</h3>
                <div class="menu-grid">
                    <div class="menu-item" onclick="toggleItem(this, 'Coffee', 4)">Coffee ($4)</div>
                    <div class="menu-item" onclick="toggleItem(this, 'Matcha', 6)">Matcha ($6)</div>
                    <div class="menu-item" onclick="toggleItem(this, 'Muffin', 3)">Muffin ($3)</div>
                    <div class="menu-item" onclick="toggleItem(this, 'Whole Pie', 12)">Whole Pie ($12)</div>
                </div>
                <div class="total-box">Total: $<span id="totalPrice">0</span></div>
                <button class="btn-action" onclick="submitOrder()">Send to Counter</button>
            </div>

            <div>
                <div class="panel">
                    <h3>Active Tickets</h3>
                    <div id="activeList">No active orders.</div>
                </div>
                <div class="panel">
                    <h3>📜 Past Orders</h3>
                    <div id="pastList">No history.</div>
                </div>
            </div>

            <div class="panel">
                <h3>🔔 Notifications</h3>
                <div id="notifList">
                    <p style="color: var(--text-muted); font-size: 13px;">No new alerts.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE_API_URL = "https://api.steinhq.com/v1/storages/6a2c070092b1163e97066729";
        let loggedInUser = null;
        let selectedItems = [];
        let currentTotal = 0;

        function handleAuth() {
            const name = document.getElementById('authName').value.trim();
            if(!name) return;
            loggedInUser = name;
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
            document.getElementById('userGreeting').innerText = `👤 ${loggedInUser}`;
            fetchData(); setInterval(fetchData, 5000);
        }

        function toggleItem(el, name, price) {
            el.classList.toggle('selected');
            const idx = selectedItems.indexOf(name);
            if(idx > -1) { selectedItems.splice(idx, 1); currentTotal -= price; }
            else { selectedItems.push(name); currentTotal += price; }
            document.getElementById('totalPrice').innerText = currentTotal;
        }

        async function submitOrder() {
            if(selectedItems.length === 0) return;
            await fetch(`${BASE_API_URL}/Sheet1`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify([{ id: 'ORD-'+Math.floor(Math.random()*9000), customer: loggedInUser, items: selectedItems.join(', '), total: currentTotal, status: 'Pending', paid: 'No' }])
            });
            alert("Sent! Pay at counter.");
            selectedItems = []; currentTotal = 0; document.getElementById('totalPrice').innerText = '0';
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('selected'));
            fetchData();
        }

        async function fetchData() {
            try {
                // Fetch Orders
                const res = await fetch(`${BASE_API_URL}/Sheet1?search={"customer":"${loggedInUser}"}`);
                const data = await res.json();
                document.getElementById('activeList').innerHTML = data.length ? data.reverse().map(o => `<div class="order-card"><strong>${o.id}</strong> <span class="badge ${o.paid==='Yes'?'paid':'unpaid'}">${o.paid==='Yes'?'Paid':'Unpaid'}</span><br><small>${o.items} - $${o.total}</small></div>`).join('') : 'No active orders.';
                
                // Fetch Notifications (Mocks a check in an alerts sheet)
                const notifRes = await fetch(`${BASE_API_URL}/alerts?search={"target":"${loggedInUser}"}`);
                const notifs = await notifRes.json();
                if(notifs && notifs.length > 0 && !notifs.error) {
                    document.getElementById('notifList').innerHTML = notifs.reverse().map(n => `<div class="notif-card"><strong>📬 ${n.title}</strong><p style="margin:5px 0 0; font-size:12px;">${n.message}</p></div>`).join('');
                }
            } catch(e) {}
        }
    </script>
</body>
</html>
