<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ A&A Cafe | Terminal</title>
    <style>
        :root {
            --bg-main: #f1f5f9; --surface: #ffffff; --border: #cbd5e1;
            --accent: #2563eb; --text-main: #0f172a; --text-muted: #64748b;
            --pos-green: #10b981; --pos-red: #ef4444;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; }
        .topbar { background: var(--accent); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .topbar h1 { margin: 0; font-size: 20px; }
        .tab-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .tab-btn.active, .tab-btn:hover { background: white; color: var(--accent); }
        
        .workspace { padding: 30px; max-width: 1400px; margin: auto; }
        .view-panel { display: none; }
        .view-panel.active { display: block; }
        .panel { background: var(--surface); padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        h2, h3 { margin-top: 0; border-bottom: 2px solid var(--bg-main); padding-bottom: 10px; }
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        
        /* Kitchen Cards */
        .kitchen-stack { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-top: 4px solid var(--accent); padding: 15px; border-radius: 8px; }
        .btn-paid { background: var(--pos-green); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 5px; }
        .btn-override { background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 6px; border-radius: 6px; cursor: pointer; font-size: 11px; width: 100%; }

        /* Dashboard Stats */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .stat-box { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 8px; text-align: center; }
        .stat-box h4 { margin: 0 0 10px 0; color: var(--text-muted); }
        .stat-box .num { font-size: 28px; font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

    <div id="authGate" style="max-width: 350px; margin: 100px auto;" class="panel">
        <h2>Terminal Login</h2>
        <input type="text" id="staffName" placeholder="Staff Name">
        <input type="password" id="staffPin" placeholder="PIN">
        <button class="btn" onclick="login()">Enter Terminal</button>
    </div>

    <div id="mainConsole" style="display: none;">
        <div class="topbar">
            <h1>⚡ A&A CAFE TERMINAL</h1>
            <div>
                <button class="tab-btn active" onclick="nav('kitchen')">🍳 Kitchen</button>
                <button class="tab-btn" onclick="nav('manager')">📊 Manager</button>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <span id="shiftStatus" style="font-size: 12px; font-weight: bold;">🔴 Clocked Out</span>
                <button onclick="toggleShift()" id="shiftBtn" style="background: white; color: var(--accent); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">Clock In</button>
            </div>
        </div>

        <div class="workspace">
            <div id="kitchen" class="view-panel active">
                <h3>Live Queue</h3>
                <div class="kitchen-stack" id="liveQueue">Loading...</div>
            </div>

            <div id="manager" class="view-panel">
                <div class="stat-grid">
                    <div class="stat-box"><h4>Gross Revenue</h4><div class="num" id="statGross">$0</div></div>
                    <div class="stat-box"><h4>Staff Payouts</h4><div class="num" id="statPayouts" style="color: var(--pos-red);">-$0</div></div>
                    <div class="stat-box"><h4>Net Balance</h4><div class="num" id="statNet">$0</div></div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="panel">
                        <h3>🛡️ Log Staff Payout</h3>
                        <input type="text" id="payName" placeholder="Employee Username">
                        <input type="number" id="payAmount" placeholder="Total Paid ($)">
                        <button class="btn" onclick="logPayout()">Submit Payout & Notify</button>
                    </div>
                    <div class="panel">
                        <h3>💰 Vault Overrides</h3>
                        <input type="number" id="overrideAmount" placeholder="Amount ($)">
                        <input type="text" id="overrideReason" placeholder="Reason (e.g. Bills, Ingredients)">
                        <div style="display: flex; gap: 10px;">
                            <button class="btn" style="background: var(--pos-green);" onclick="vaultOverride('add')">Add Funds (+)</button>
                            <button class="btn" style="background: var(--pos-red);" onclick="vaultOverride('remove')">Remove Funds (-)</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE_API_URL = "https://api.steinhq.com/v1/storages/6a2c070092b1163e97066729";
        let staffUser = "";
        let isClockedIn = false;
        let shiftStart = 0;
        
        // Finances Local Simulation (Bind to DB in production)
        let f_gross = 0; let f_payouts = 0; let f_net = 0;

        function nav(id) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function login() {
            staffUser = document.getElementById('staffName').value;
            if(!staffUser) return;
            document.getElementById('authGate').style.display = 'none';
            document.getElementById('mainConsole').style.display = 'block';
            fetchQueue(); setInterval(fetchQueue, 5000);
            updateDashboard();
        }

        function toggleShift() {
            isClockedIn = !isClockedIn;
            const btn = document.getElementById('shiftBtn');
            const stat = document.getElementById('shiftStatus');
            if(isClockedIn) {
                shiftStart = Date.now();
                btn.innerText = "Clock Out";
                btn.style.color = "var(--pos-red)";
                stat.innerText = "🟢 Clocked In";
            } else {
                let workedMin = Math.round((Date.now() - shiftStart) / 60000);
                alert(`Shift ended. You worked ${workedMin} minutes.`);
                btn.innerText = "Clock In";
                btn.style.color = "var(--accent)";
                stat.innerText = "🔴 Clocked Out";
            }
        }

        async function fetchQueue() {
            try {
                const res = await fetch(`${BASE_API_URL}/Sheet1`);
                const data = await res.json();
                const q = document.getElementById('liveQueue');
                if(!data || data.length === 0 || data.error) return q.innerHTML = "Queue clear.";
                
                q.innerHTML = data.reverse().map(o => `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                            <strong>${o.id}</strong> <span>${o.customer}</span>
                        </div>
                        <p style="margin:0 0 10px; font-size:13px; color:var(--text-muted);">${o.items}</p>
                        
                        ${o.paid !== 'Yes' ? `
                            <button class="btn-paid" onclick="processCheckout('${o.id}', ${o.total})">Mark Paid ($${o.total})</button>
                            <button class="btn-override" onclick="processOverride('${o.id}', ${o.total})">Custom / Tip Override</button>
                        ` : `
                            <button class="btn" onclick="clearTicket('${o.id}')">Complete Order</button>
                        `}
                    </div>
                `).join('');
            } catch(e){}
        }

        async function processCheckout(id, total) {
            logFinance(total, 0); // Add to gross
            await fetch(`${BASE_API_URL}/Sheet1`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({condition:{id:id}, set:{paid:'Yes'}}) });
            fetchQueue();
        }

        async function processOverride(id, baseTotal) {
            const custom = prompt(`Enter exact $ amount received (Base was $${baseTotal}):`);
            if(!custom || isNaN(custom)) return;
            logFinance(parseFloat(custom), 0);
            await fetch(`${BASE_API_URL}/Sheet1`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({condition:{id:id}, set:{paid:'Yes', notes:`Override: $${custom}`}}) });
            fetchQueue();
        }

        async function clearTicket(id) {
            await fetch(`${BASE_API_URL}/Sheet1`, { method: 'DELETE', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({condition:{id:id}}) });
            fetchQueue();
        }

        async function logPayout() {
            const name = document.getElementById('payName').value;
            const amt = parseFloat(document.getElementById('payAmount').value);
            if(!name || !amt) return;
            logFinance(0, amt);
            
            // Send to notification sheet
            await fetch(`${BASE_API_URL}/alerts`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify([{target: name, title: 'Payroll Dispatched', message: `Management has authorized a payout of $${amt}. Please collect at counter.`}])
            });
            
            document.getElementById('payName').value = '';
            document.getElementById('payAmount').value = '';
            alert("Payout logged and staff notified!");
        }

        function vaultOverride(type) {
            const amt = parseFloat(document.getElementById('overrideAmount').value);
            if(!amt) return;
            if(type === 'add') logFinance(amt, 0);
            if(type === 'remove') logFinance(0, amt);
            document.getElementById('overrideAmount').value = '';
            document.getElementById('overrideReason').value = '';
        }

        function logFinance(addGross, addPayout) {
            f_gross += addGross;
            f_payouts += addPayout;
            f_net = f_gross - f_payouts;
            updateDashboard();
        }

        function updateDashboard() {
            document.getElementById('statGross').innerText = `$${f_gross}`;
            document.getElementById('statPayouts').innerText = `-$${f_payouts}`;
            document.getElementById('statNet').innerText = `$${f_net}`;
            document.getElementById('statNet').style.color = f_net < 0 ? 'var(--pos-red)' : 'var(--accent)';
        }
    </script>
</body>
</html>
