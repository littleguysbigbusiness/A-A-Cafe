<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍽️ A&A Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f8fc;
            --bg-card: #ffffff;
            --border: #e4e8f0;
            --text: #0d1b2a;
            --text-muted: #6b7a94;
            --text-dim: #aab4c8;
            --gold: #d4960a;
            --green: #0d9e6e;
            --radius: 18px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        /* ── LOADING SCREEN ── */
        #loadingScreen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 100;
            transition: opacity 0.4s ease;
        }
        #loadingScreen.fade-out { opacity: 0; pointer-events: none; }
        .loading-logo { font-size: 40px; animation: loadBounce 1s ease-in-out infinite; }
        @keyframes loadBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        .loading-text { font-size: 13px; color: var(--text-muted); font-weight: 500; letter-spacing: 0.05em; }
        .loading-dots::after {
            content: '';
            animation: dots 1.4s steps(4, end) infinite;
        }
        @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }

        /* ── MAIN CONTENT ── */
        #mainContent {
            width: 100%;
            max-width: 540px;
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        #mainContent.visible { opacity: 1; transform: translateY(0); }

        /* ── HEADER ── */
        .hub-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .hub-eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 12px;
            opacity: 0.85;
        }
        .hub-title {
            font-size: clamp(32px, 8vw, 54px);
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1;
            color: var(--text);
            margin-bottom: 10px;
        }

        /* ── PROMPT ── */
        .prompt-label {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }
        .prompt-sub {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* ── OPEN SHOPS ── */
        .open-shops { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }

        .shop-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            animation: shopIn 0.4s ease both;
            position: relative;
            overflow: hidden;
        }
        .shop-btn:nth-child(1) { animation-delay: 0.05s; }
        .shop-btn:nth-child(2) { animation-delay: 0.12s; }
        .shop-btn:nth-child(3) { animation-delay: 0.19s; }
        @keyframes shopIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .shop-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .shop-btn-cafe::before    { background: linear-gradient(135deg, rgba(0,102,204,0.08), transparent); }
        .shop-btn-steak::before   { background: linear-gradient(135deg, rgba(192,80,28,0.1), transparent); }
        .shop-btn-chinese::before { background: linear-gradient(135deg, rgba(192,28,28,0.1), transparent); }

        .shop-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.1); }
        .shop-btn:hover::before { opacity: 1; }
        .shop-btn-cafe:hover    { border-color: rgba(59,158,255,0.4); }
        .shop-btn-steak:hover   { border-color: rgba(192,80,28,0.5); }
        .shop-btn-chinese:hover { border-color: rgba(192,28,28,0.5); }
        .shop-btn:active { transform: translateY(0); }

        .shop-icon {
            font-size: 36px;
            width: 56px; height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .icon-cafe    { background: linear-gradient(135deg, #003f7f, #0066cc); }
        .icon-steak   { background: linear-gradient(135deg, #5c2510, #c0501c); }
        .icon-chinese { background: linear-gradient(135deg, #5c1010, #c01c1c); }

        .shop-info { flex: 1; min-width: 0; }
        .shop-name { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 3px; }
        .shop-tags { font-size: 12px; color: var(--text-muted); }

        .shop-arrow {
            font-size: 18px;
            color: var(--text-muted);
            flex-shrink: 0;
            transition: transform 0.2s, color 0.2s;
        }
        .shop-btn:hover .shop-arrow { transform: translateX(4px); color: var(--text); }

        /* ── NO OPEN SHOPS ── */
        #noOpenMsg {
            display: none;
            text-align: center;
            padding: 32px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 28px;
        }
        #noOpenMsg .no-icon { font-size: 36px; margin-bottom: 10px; }
        #noOpenMsg p { color: var(--text-muted); font-size: 14px; line-height: 1.6; }

        /* ── CLOSED LIST ── */
        .closed-section {
            display: none;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }
        .closed-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            margin-bottom: 12px;
        }
        .closed-list { display: flex; flex-direction: column; gap: 8px; }
        .closed-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(0,0,0,0.02);
            border: 1px solid rgba(0,0,0,0.05);
            opacity: 0.5;
        }
        .closed-item-icon { font-size: 20px; }
        .closed-item-name { font-size: 13px; font-weight: 600; color: var(--text-muted); flex: 1; }
        .closed-pill {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 3px 9px;
            border-radius: 20px;
            background: rgba(0,0,0,0.04);
            color: var(--text-dim);
            border: 1px solid rgba(0,0,0,0.06);
        }

        /* ── FOOTER ── */
        .hub-footer {
            text-align: center;
            margin-top: 32px;
            font-size: 12px;
            color: var(--text-dim);
        }
        .hub-footer a { color: var(--text-muted); text-decoration: none; transition: color 0.15s; }
        .hub-footer a:hover { color: var(--text); }

        /* ── REFRESH DOT ── */
        .refresh-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 28px;
        }
        .live-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
            animation: livePulse 2s ease-in-out infinite;
        }
        @keyframes livePulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    </style>
</head>
<body>

<!-- Loading -->
<div id="loadingScreen">
    <div class="loading-logo">🍽️</div>
    <div class="loading-text">Checking what's open<span class="loading-dots"></span></div>
</div>

<!-- Main -->
<div id="mainContent">
    <div class="hub-header">
        <div class="hub-eyebrow">✦ Welcome to</div>
        <div class="hub-title">A&amp;A Hub</div>
    </div>

    <div class="refresh-row">
        <div class="live-dot"></div>
        <span id="liveStatusText">Live status</span>
    </div>

    <div class="prompt-label" id="promptLabel">Where do you want to order?</div>
    <div class="prompt-sub" id="promptSub">Select a restaurant below to get started.</div>

    <!-- Open shops render here -->
    <div class="open-shops" id="openShopsList"></div>

    <!-- Shown when nothing is open -->
    <div id="noOpenMsg">
        <div class="no-icon">😴</div>
        <p>All restaurants are currently closed.<br>Check back soon!</p>
    </div>

    <!-- Closed shops listed below -->
    <div class="closed-section" id="closedSection">
        <div class="closed-label">Not available right now</div>
        <div class="closed-list" id="closedShopsList"></div>
    </div>

    <div class="hub-footer">
        A&amp;A Group © 2026
    </div>
</div>

<script>
    const HUB_API = "https://script.google.com/macros/s/AKfycbwjzyfFJG8ek3zrGvdK3eLnRtDfngs51VXTAzgSb-3bUkKdTeaY-USlI7ZDF8l0eVwO/exec";

    const SHOP_DEFS = [
        { key: 'cafe',    emoji: '☕', name: 'A&A Cafe',       tags: 'Coffee · Pastries · Snacks',       page: 'cafe.html',       btnClass: 'shop-btn-cafe',    iconClass: 'icon-cafe'    },
        { key: 'steakhouse', emoji: '🍽️', name: 'A&A Buffet', tags: 'Mains · Sides · Desserts',      page: 'steakhouse.html', btnClass: 'shop-btn-steak',   iconClass: 'icon-steak'   },
        { key: 'chinese', emoji: '🥡', name: 'A&A Chinese',    tags: 'Asian Specials · Mains · Drinks',          page: 'chinese.html',    btnClass: 'shop-btn-chinese', iconClass: 'icon-chinese' },
    ];

    async function loadStatus() {
        let statusMap = {};
        try {
            const res = await fetch(`${HUB_API}?sheet=shopstatus`);
            const data = await res.json();
            if (Array.isArray(data)) {
                data.forEach(row => {
                    if (row.shop) statusMap[row.shop.toLowerCase()] = String(row.open).toLowerCase() === 'true';
                });
            } else if (data && typeof data === 'object') {
                statusMap = data;
            }
        } catch { return null; }
        return statusMap;
    }

    function renderHub(statusMap) {
        const openList   = document.getElementById('openShopsList');
        const closedList = document.getElementById('closedShopsList');
        const noOpen     = document.getElementById('noOpenMsg');
        const closedSec  = document.getElementById('closedSection');
        const promptLbl  = document.getElementById('promptLabel');
        const promptSub  = document.getElementById('promptSub');
        const liveText   = document.getElementById('liveStatusText');

        openList.innerHTML   = '';
        closedList.innerHTML = '';

        const openShops   = SHOP_DEFS.filter(s => statusMap[s.key] === true);
        const closedShops = SHOP_DEFS.filter(s => statusMap[s.key] !== true);

        // Update prompt text
        if (openShops.length === 0) {
            promptLbl.textContent = 'All restaurants are closed';
            promptSub.textContent = 'Nothing is open right now. Come back soon!';
            noOpen.style.display  = 'block';
            liveText.textContent  = 'All closed right now';
        } else {
            promptLbl.textContent = 'Where do you want to order?';
            promptSub.textContent = openShops.length === 1
                ? '1 restaurant is open right now — tap to order.'
                : `${openShops.length} restaurants are open right now — tap to order.`;
            noOpen.style.display  = 'none';
            liveText.textContent  = openShops.length === 1 ? '1 restaurant open' : `${openShops.length} restaurants open`;
        }

        // Drive-Thru status line
        let dtLine = document.getElementById('driveThruLine');
        if (!dtLine) {
            dtLine = document.createElement('div');
            dtLine.id = 'driveThruLine';
            dtLine.style.cssText = 'text-align:center;font-size:13px;font-weight:700;margin:-12px 0 20px;';
            openList.parentNode.insertBefore(dtLine, openList);
        }
        const dtOpen = statusMap.drivethru === true;
        dtLine.textContent = dtOpen ? '☕🚗 Cafe Drive-Thru is OPEN' : '☕🚗 Cafe Drive-Thru is closed';
        dtLine.style.color = dtOpen ? '#1e8e3e' : '#999';
        dtLine.style.display = statusMap.cafe === true ? 'block' : 'none';

        // Render open buttons
        openShops.forEach(s => {
            const a = document.createElement('a');
            a.href = s.page;
            a.className = `shop-btn ${s.btnClass}`;
            a.innerHTML = `
                <div class="shop-icon ${s.iconClass}">${s.emoji}</div>
                <div class="shop-info">
                    <div class="shop-name">${s.name}</div>
                    <div class="shop-tags">${s.tags}</div>
                </div>
                <div class="shop-arrow">→</div>`;
            openList.appendChild(a);
        });

        // Render closed list (only if at least one is open — otherwise noOpen covers it)
        if (openShops.length > 0 && closedShops.length > 0) {
            closedShops.forEach(s => {
                const div = document.createElement('div');
                div.className = 'closed-item';
                div.innerHTML = `
                    <div class="closed-item-icon">${s.emoji}</div>
                    <div class="closed-item-name">${s.name}</div>
                    <div class="closed-pill">Closed</div>`;
                closedList.appendChild(div);
            });
            closedSec.style.display = 'block';
        } else {
            closedSec.style.display = 'none';
        }
    }

    function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

    async function init() {
        // show the last-known status instantly, then refresh from the sheet
        const cached = lsGet('hubStatus');
        if (cached) {
            try {
                renderHub(JSON.parse(cached));
                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('mainContent').classList.add('visible');
            } catch {}
        }
        const statusMap = (await loadStatus()) || (cached ? JSON.parse(cached) : {});
        lsSet('hubStatus', JSON.stringify(statusMap));

        // Hide loading, show content
        const loading = document.getElementById('loadingScreen');
        const content = document.getElementById('mainContent');
        loading.classList.add('fade-out');
        setTimeout(() => { loading.style.display = 'none'; }, 400);
        renderHub(statusMap);
        content.classList.add('visible');

        // Refresh every 30s
        setInterval(async () => {
            const fresh = await loadStatus();
            if (fresh) { renderHub(fresh); lsSet('hubStatus', JSON.stringify(fresh)); } // keep last good state if the network blips
        }, 30000);
    }

    init();
</script>
</body>
</html>
